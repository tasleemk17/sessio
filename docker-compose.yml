services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
    volumes:
      - sessio-data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5190:80"

volumes:
  sessio-data:
