server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;   # document uploads are limited to 5 MB by the API
  include /etc/nginx/snippets/security-headers.conf;

  # The API lives behind the same address, so the browser needs no CORS and no API URL baked in
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Overwrites whatever the caller sent, so the API can trust the last address (TRUST_PROXY=true)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;   # React Router: every page is index.html
  }
}
