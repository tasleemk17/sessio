# Render Blueprint for the API. The website goes to Vercel, the database to Neon: see docs/DEPLOY.md.
# Render reads this file when you choose New > Blueprint and point it at this repository.
services:
  - type: web
    name: sessio-api
    runtime: docker
    plan: free
    region: singapore          # closest to India; cannot be changed after creation
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT        # production: the API refuses to start with a weak secret or unsafe settings
        value: production
      - key: TRUST_PROXY        # Render's proxy sets the caller's address; used for rate limits
        value: "true"
      - key: JWT_SECRET
        generateValue: true     # Render makes a long random value, so you never type one
      # Asked for once, when the Blueprint is created. They are never stored in Git.
      - key: DATABASE_URL       # the Neon connection string
        sync: false
      - key: CORS_ORIGINS       # your Vercel address, for example https://sessio.vercel.app
        sync: false
      - key: RAZORPAY_KEY_ID    # your rzp_test_ key
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET   # the secret you type into Razorpay's webhook form
        sync: false
      - key: ALLOW_MOCK_PAYMENTS       # "true" only for a labelled demo with no Razorpay keys: anyone can then book free
        value: "false"
